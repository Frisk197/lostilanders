[package]
name = "lostilanders"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "=0.7.10", features = ["fullstack", "router"] }

sqlx = { version = "0.9.0", optional = true, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "time"
] }

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = { version = "0.15", optional = true }
tokio = "1.53.1"
serde = { version = "1.0.229", features = ["derive"] }
ssh-key = { version =  "0.6.7", features = ["ed25519"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }
dioxus-icons = { version = "0.1.0", default-features = false }
argon2 = { version = "0.6", optional = true }
dioxus-ssr = "0.7.10"
getrandom = { version = "=0.3.4", optional = true }
sha2 = { version = "=0.10.9", optional = true }
hex = { version = "=0.4.3", optional = true }
pulldown-cmark = "0.13.4"
ammonia = "4.2.0"
time = { version = "0.3.44", default-features = false, features = ["std", "wasm-bindgen", "serde"] }

[features]
default = []
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:sqlx",
    "dep:dotenvy",
    "dep:argon2",
    "dep:getrandom",
    "dep:sha2",
    "dep:hex",
]

[patch."https://github.com/DioxusLabs/components"]
dioxus-primitives = { path = "vendor/components/primitives" }
